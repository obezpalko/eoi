version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Security advisories still open PRs immediately, outside this cap.
    open-pull-requests-limit: 5
    groups:
      # One PR for all routine minor/patch bumps, so the lockfile is
      # touched once instead of per-package (which caused #12-#19 to
      # pile up and conflict with each other).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Quartz 4 (and upstream Quartz 5) is built on preact 10; preact 11
      # drops JSXInternal.HTMLAttributes and breaks tsc (see #49). Revisit
      # when upstream Quartz moves to preact 11.
      - dependency-name: "preact"
        update-types: ["version-update:semver-major"]
    # Majors stay separate — they need the build checked individually.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"
